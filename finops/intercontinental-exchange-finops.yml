specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Intercontinental Exchange
providerId: intercontinental-exchange
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - FinOps
  - FOCUS
  - Market Data
  - Financial Exchanges
description: 'FOCUS-aligned FinOps placeholder for Intercontinental Exchange: contract-based market
  data and mortgage technology APIs with negotiated subscription fees and per-feed entitlements.'
notes: ICE does not publish rate cards; meters and unit economics below describe the typical billable
  surface for market data and mortgage technology APIs but cannot be reconciled without a customer contract.
sources:
  - https://www.ice.com/
  - https://developer.theice.com/hc/en-us
  - https://idsportal.icedataservices.com/marketdata
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Intercontinental Exchange, Inc.
serviceCategory: Market Data
billingModel:
  pricingCategory: Subscription
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Usage
    - Tax
    - Adjustment
focusColumns:
  ServiceName: Intercontinental Exchange
  ServiceCategory: Market Data
  ProviderName: Intercontinental Exchange
  PublisherName: Intercontinental Exchange, Inc.
  InvoiceIssuerName: Intercontinental Exchange, Inc.
  BillingCurrency: USD
meters:
  - name: data_feed_subscription
    unit: month
    aggregation: sum
    dimensions:
      - feed
      - exchange
      - market_data_tier
  - name: symbols_entitled
    unit: symbol
    aggregation: max
    dimensions:
      - exchange
      - asset_class
  - name: redistribution_users
    unit: seat
    aggregation: max
    dimensions:
      - feed
      - user_class
  - name: api_requests
    unit: request
    aggregation: sum
    dimensions:
      - api
      - endpoint
principles:
  - name: Visibility
    description: Reconcile monthly ICE invoices against entitled feeds and redistribution counts; use
      ICE customer portal usage exports where available.
  - name: Allocation
    description: Tag downstream consumers (trading desks, research, retail clients) to attribute feed
      and redistribution costs back to revenue-producing units.
  - name: Optimization
    description: Right-size feed entitlements (delayed vs real-time, full-depth vs top-of-book) and
      consolidate redundant exchange feeds during contract renewal.
  - name: Accountability
    description: Establish a market-data manager role; review entitlements quarterly and exit unused
      symbols/feeds before annual true-up.
maintainers:
  - FN: API Evangelist
    email: info@apievangelist.com
