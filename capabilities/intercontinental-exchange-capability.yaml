naftiko: 1.0.0-alpha2
info:
  label: ICE Consolidated Feed API
  description: The ICE Consolidated Feed API provides access to ICE Data Services real-time and delayed market data from exchanges
    operated by Intercontinental Exchange including ICE Futures, NYSE, and other trading venues.
  tags:
  - Intercontinental
  - Exchange
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: intercontinental-exchange
    baseUri: https://api.theice.com
    description: ICE Consolidated Feed API HTTP API.
    authentication:
      type: apikey
      in: header
      name: Authorization
      value: '{{INTERCONTINENTAL_EXCHANGE_TOKEN}}'
    resources:
    - name: marketdata-instruments
      path: /marketdata/instruments
      operations:
      - name: listinstruments
        method: GET
        description: List instruments
        inputParameters:
        - name: exchange
          in: query
          type: string
          description: Filter by exchange code.
        - name: productType
          in: query
          type: string
          description: Filter by product type (futures, options, etc.).
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: marketdata-quotes
      path: /marketdata/quotes
      operations:
      - name: getquotes
        method: GET
        description: Get market quotes
        inputParameters:
        - name: instrumentId
          in: query
          type: string
          required: true
          description: The instrument identifier.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: marketdata-history
      path: /marketdata/history
      operations:
      - name: getmarkethistory
        method: GET
        description: Get market data history
        inputParameters:
        - name: instrumentId
          in: query
          type: string
          required: true
          description: The instrument identifier.
        - name: startDate
          in: query
          type: string
          description: Start date for historical data.
        - name: endDate
          in: query
          type: string
          description: End date for historical data.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: reference-exchanges
      path: /reference/exchanges
      operations:
      - name: listexchanges
        method: GET
        description: List exchanges
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: intercontinental-exchange-rest
    description: REST adapter for ICE Consolidated Feed API.
    resources:
    - path: /marketdata/instruments
      name: listinstruments
      operations:
      - method: GET
        name: listinstruments
        description: List instruments
        call: intercontinental-exchange.listinstruments
        outputParameters:
        - type: object
          mapping: $.
    - path: /marketdata/quotes
      name: getquotes
      operations:
      - method: GET
        name: getquotes
        description: Get market quotes
        call: intercontinental-exchange.getquotes
        outputParameters:
        - type: object
          mapping: $.
    - path: /marketdata/history
      name: getmarkethistory
      operations:
      - method: GET
        name: getmarkethistory
        description: Get market data history
        call: intercontinental-exchange.getmarkethistory
        outputParameters:
        - type: object
          mapping: $.
    - path: /reference/exchanges
      name: listexchanges
      operations:
      - method: GET
        name: listexchanges
        description: List exchanges
        call: intercontinental-exchange.listexchanges
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: intercontinental-exchange-mcp
    transport: http
    description: MCP adapter for ICE Consolidated Feed API for AI agent use.
    tools:
    - name: listinstruments
      description: List instruments
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: intercontinental-exchange.listinstruments
      with:
        exchange: tools.exchange
        productType: tools.productType
      inputParameters:
      - name: exchange
        type: string
        description: Filter by exchange code.
      - name: productType
        type: string
        description: Filter by product type (futures, options, etc.).
      outputParameters:
      - type: object
        mapping: $.
    - name: getquotes
      description: Get market quotes
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: intercontinental-exchange.getquotes
      with:
        instrumentId: tools.instrumentId
      inputParameters:
      - name: instrumentId
        type: string
        description: The instrument identifier.
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: getmarkethistory
      description: Get market data history
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: intercontinental-exchange.getmarkethistory
      with:
        instrumentId: tools.instrumentId
        startDate: tools.startDate
        endDate: tools.endDate
      inputParameters:
      - name: instrumentId
        type: string
        description: The instrument identifier.
        required: true
      - name: startDate
        type: string
        description: Start date for historical data.
      - name: endDate
        type: string
        description: End date for historical data.
      outputParameters:
      - type: object
        mapping: $.
    - name: listexchanges
      description: List exchanges
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: intercontinental-exchange.listexchanges
      outputParameters:
      - type: object
        mapping: $.
binds:
- namespace: env
  keys:
    INTERCONTINENTAL_EXCHANGE_TOKEN: INTERCONTINENTAL_EXCHANGE_TOKEN
