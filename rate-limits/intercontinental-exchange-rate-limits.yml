tags:
  - Rate Limiting
  - Market Data
  - Financial Exchanges
description: Intercontinental Exchange does not publish standardized rate-limit numbers for its API
  surface. Limits are governed per contract and depend on the chosen data feed, redistribution rights,
  and connectivity model (REST, WebSocket, FIX). Real-time market data feeds enforce per-message and
  per-symbol entitlement controls rather than HTTP-style RPM caps.
notes: No public rate-limit documentation is available; numbers are negotiated and enforced contractually
  by ICE Data Services and ICE Mortgage Technology.
sources:
  - https://developer.theice.com/hc/en-us
  - https://idsportal.icedataservices.com/marketdata
  - https://mortgagetech.ice.com/products/developer-portal
responseCodes:
  throttled: 429
limits:
  - name: Contractual Limit
    scope: account
    metric: varies
    limit: see contract
policies:
  - name: Entitlement
    description: Symbol, exchange, and redistribution rights are enforced per entitlement; requests
      outside entitlement are rejected regardless of request rate.
  - name: Contract Negotiation
    description: Burst, steady-state, and concurrent connection limits are negotiated with ICE sales
      and provisioned at the API gateway.
