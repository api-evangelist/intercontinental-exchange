description: Intercontinental Exchange does not publish public, self-service pricing for the ICE Consolidated
  Feed API, ICE Data Services API, or ICE Mortgage Technology Developer Portal. Access is sold under
  enterprise/contract terms negotiated through ICE sales, with pricing tied to data feeds, market coverage,
  redistribution rights, and connectivity. Plan structure below is a contractual placeholder until ICE
  publishes machine-readable pricing.
notes: No public pricing page is available. All ICE API access is contractual; consumers must engage
  ICE Data Services or ICE Mortgage Technology sales for terms, entitlements, and fees.
sources:
  - https://developer.theice.com/hc/en-us
  - https://idsportal.icedataservices.com/marketdata
  - https://mortgagetech.ice.com/products/developer-portal
plans:
  - id: intercontinental-exchange-contract
    name: ICE Contract Access
    type: enterprise
    description: Negotiated contract access to ICE Consolidated Feed, ICE Data Services, and ICE Mortgage
      Technology APIs. Pricing depends on data scope, redistribution, and connectivity model.
    entries:
      - label: Contract Pricing
        name: contract
        type: subscription
        metric: contract
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: ICE Consolidated Feed API
      - name: ICE Data Services API
      - name: ICE Mortgage Technology Developer Portal
      - name: Negotiated SLA
      - name: Dedicated technical account management
