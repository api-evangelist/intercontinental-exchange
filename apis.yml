aid: intercontinental-exchange
name: Intercontinental Exchange
description: >-
  Intercontinental Exchange (ICE) operates global exchanges, clearing houses, and data services for financial and
  commodity markets, including the New York Stock Exchange (NYSE). ICE provides multiple developer portals including the
  Developer Center at developer.theice.com for market data APIs, the IDS Portal for real-time data integration, and the
  ICE Mortgage Technology Developer Portal for lending application development.
