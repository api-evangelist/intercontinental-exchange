apis:
  - aid: intercontinental-exchange:consolidated-feed-api
    name: ICE Consolidated Feed API
    description: >-
      The ICE Consolidated Feed API provides developers with access to ICE Data Services real-time and delayed market
      data. The API delivers consolidated market data feeds from exchanges operated by Intercontinental Exchange
      including ICE Futures, NYSE, and other trading venues. The Developer Center provides detailed API documentation,
      samples, and SDK downloads.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://developer.theice.com/hc/en-us
    baseURL: https://api.theice.com
    tags:
      - Exchanges
      - Financial Data
      - Market Data
      - Real-Time Data
      - Trading
    properties:
      - type: Portal
        url: https://developer.theice.com/hc/en-us
      - type: Documentation
        url: https://developer.theice.com/hc/en-us/articles/200717514-About-the-Consolidated-Feed-API
      - type: OpenAPI
        url: openapi/intercontinental-exchange-instruments-api-openapi.yml
      - type: OpenAPI
        url: openapi/intercontinental-exchange-market-data-api-openapi.yml
      - type: OpenAPI
        url: openapi/intercontinental-exchange-reference-data-api-openapi.yml
      - type: Overlay
        url: overlays/intercontinental-exchange-instruments-api-overlay.yaml
      - type: Overlay
        url: overlays/intercontinental-exchange-market-data-api-overlay.yaml
      - type: Overlay
        url: overlays/intercontinental-exchange-reference-data-api-overlay.yaml
      - type: Postman
        url: collections/ice-consolidated-feed-api.postman_collection.json
      - type: MCPServer
        url: mcp/intercontinental-exchange-mcp.yml
  - aid: intercontinental-exchange:data-services-api
    name: ICE Data Services API
    description: >-
      The ICE Data Services API provides access to market data, reference data, and analytics from Intercontinental
      Exchange. The IDS Portal provides documentation, tools, and software required for integrating with ICE Data
      Services real-time market data solutions.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://idsportal.icedataservices.com/marketdata
    baseURL: https://idsportal.icedataservices.com
    tags:
      - Analytics
      - Financial Services
      - Market Data
      - Reference Data
    properties:
      - type: Portal
        url: https://idsportal.icedataservices.com/marketdata
      - type: Documentation
        url: https://idsportal.icedataservices.com/marketdata
  - aid: intercontinental-exchange:mortgage-technology-api
    name: ICE Mortgage Technology Developer Portal
    description: >-
      The ICE Mortgage Technology Developer Portal is a self-service solution providing developers with resources and
      documentation to build and deploy mortgage lending applications. It includes a comprehensive integration catalog
      representing the servicing life cycle for mortgage origination and servicing workflows.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://mortgagetech.ice.com/products/developer-portal
    baseURL: https://api.mortgagetech.ice.com
    tags:
      - Financial Services
      - Lending
      - Mortgage
      - Real Estate
    properties:
      - type: Portal
        url: https://mortgagetech.ice.com/products/developer-portal
      - type: Documentation
        url: https://mortgagetech.ice.com/products/developer-portal
